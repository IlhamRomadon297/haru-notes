<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login — Haru Notes</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="auth.js" defer></script>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="brand-icon" aria-hidden="true">🌸</div>
        <h1>Haru Notes</h1>
        <p class="tagline">Catatan ceria ala musim semi</p>
        <div id="login-message" class="message"></div>
        <form id="login-form" class="login-form">
            <div class="input-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="nama@email.com" required autocomplete="email">
            </div>
            <div class="input-group">
                <label for="login-password">Kata Sandi</label>
                <input type="password" id="login-password" placeholder="Kata sandi Anda" required autocomplete="current-password">
            </div>
            <button type="submit">Masuk</button>
            <button type="button" id="register-button">Daftar Akun Baru</button>
        </form>
    </div>
</body>
</html>
