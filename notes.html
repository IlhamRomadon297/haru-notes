<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haru Notes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <script src="auth.js" defer></script>
</head>
<body>
    <div id="app-wrapper" class="app-wrapper hidden">
        <header class="main-header">
            <div class="header-left">
                <div class="header-brand">
                    <h1>Haru Notes</h1>
                </div>
                <span id="user-email-display" class="user-email"></span>
            </div>
            <div class="header-right">
                <button id="add-note-btn" class="btn btn-primary desktop-only">Buat Catatan Baru</button>
                <button id="logout-button" class="btn btn-danger">
                    <span class="desktop-only">Logout</span>
                    <span class="mobile-only logout-icon" aria-hidden="true">⎋</span>
                </button>
            </div>
        </header>

        <main class="container">
            <button type="button" id="compose-bar" class="compose-bar" aria-label="Buat catatan baru">
                <span class="compose-icon">✎</span>
                <span class="compose-placeholder">Buat catatan...</span>
            </button>
            <div id="no-notes-message" class="no-notes-message hidden">
                Belum ada catatan. Ketuk area di atas atau tombol + untuk memulai!
            </div>
            <div id="notes-container" class="notes-container">
                </div>
        </main>

        <button type="button" id="fab-add-note" class="fab mobile-only" aria-label="Buat catatan baru">+</button>

        <div id="modal-container" class="modal-container hidden">
            <div class="modal-content">
                <div class="modal-header-bar">
                    <button type="button" class="close-modal-btn" aria-label="Tutup">&times;</button>
                    <span id="autosave-status" class="autosave-status" aria-live="polite"></span>
                </div>
                <form id="note-form">
                    <input type="hidden" id="note-id">
                    <div class="form-group">
                        <label for="note-title" class="visually-desktop">Judul</label>
                        <input type="text" id="note-title" placeholder="Judul" required>
                    </div>
                    <div class="form-group">
                        <label class="visually-desktop">Isi Catatan</label>
                        <div id="note-content-editor" class="note-content-editor" contenteditable="true" data-placeholder="Masukkan isi catatan Anda..." required></div>
                        <div class="style-buttons">
                            <button type="button" id="bold-btn" class="style-btn" title="Bold">B</button>
                            <button type="button" id="italic-btn" class="style-btn" title="Italic">I</button>
                            <button type="button" id="uppercase-btn" class="style-btn" title="Uppercase">Aa</button>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" id="close-note-btn" class="btn btn-primary">Tutup</button>
                        <button type="button" id="delete-note-btn" class="btn btn-danger hidden">Hapus</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js" defer></script> 
</body>
</html>
